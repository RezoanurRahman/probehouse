name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORT: 4173
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test the built server
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/probehouse-server.log"
          node dist-server/server.js > "$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          health_url="http://127.0.0.1:4173/api/health"
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail "$health_url"; then
              echo
              echo "Health check passed after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 1
          done

          echo "Server did not become healthy at ${health_url} within 30 seconds." >&2
          cat "$log_file" >&2 || true
          exit 1
